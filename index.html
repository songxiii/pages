<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="欢迎来到算法世界。从一个问题开始，探索逻辑与思考的乐趣。">
  <title>算法世界</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      color: #1e293b;
      background: #f8fafc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 24px;
      color: #64748b;
      font-size: 11px;
      letter-spacing: .22em;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 600;
      letter-spacing: -.03em;
      line-height: 1.4;
    }
    .intro {
      max-width: 32em;
      margin: 0;
      color: #64748b;
      font-size: 16px;
      line-height: 1.9;
    }
    .note {
      margin: 16px 0 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ALGORITHM WORLD</p>
    <h1>欢迎来到算法世界</h1>
    <p class="intro">从一个问题开始，探索逻辑与思考的乐趣。</p>
    <p class="note">保持好奇，慢慢发现。</p>
  </main>
  <script>
    (function () {
      function readTicket(part) {
        var match = /(?:^|&)ticket(?:=([^&]*))?(?:&|$)/.exec(part);
        return match ? decodeURIComponent((match[1] || "").replace(/\+/g, " ")) : null;
      }

      var ticket = readTicket(window.location.search.slice(1));
      if (ticket === null) ticket = readTicket(window.location.hash.slice(1));

      if (ticket !== null) {
        window.location.replace("./p.html#ticket=" + encodeURIComponent(ticket));
      }
    })();
  </script>
</body>
</html>
