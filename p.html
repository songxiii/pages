<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>活动页面</title>
  <style>
    body { margin: 0; padding: 24px; background: #f6f8f7; color: #17241f; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 720px; margin: 40px auto; }
    h1 { margin: 0 0 24px; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    .profile, pre { background: #fff; border: 1px solid #e1e8e4; border-radius: 14px; }
    .profile { display: flex; align-items: center; gap: 20px; padding: 24px; margin-bottom: 28px; }
    [hidden] { display: none !important; }
    .avatar, .avatar-fallback { width: 72px; height: 72px; flex: 0 0 72px; border-radius: 50%; }
    .avatar { object-fit: cover; }
    .avatar-fallback { display: grid; place-items: center; background: #e4f0e9; color: #176348; font-size: 28px; }
    .profile > div { min-width: 0; }
    .name { margin: 0 0 8px; font-size: 22px; font-weight: 700; }
    .activity { margin: 0; color: #52635a; overflow-wrap: anywhere; }
    .activity strong { color: #17241f; }
    pre { margin: 0; padding: 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>活动信息</h1>
    <section class="profile" id="profile" hidden aria-label="用户活动信息">
      <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer" hidden>
      <span class="avatar-fallback" id="avatar-fallback" aria-hidden="true">人</span>
      <div>
        <p class="name" id="user-name"></p>
        <p class="activity">活动 ID：<strong id="activity-id"></strong></p>
      </div>
    </section>
    <h2>接口响应</h2>
    <pre id="result" role="status">正在加载…</pre>
  </main>
  <script src="./src/p.js"></script>
</body>
</html>
