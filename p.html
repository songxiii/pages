<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111b17">
  <title>扑克接口请求</title>
  <link rel="stylesheet" href="./p.css">
</head>
<body>
  <main class="page">
    <div class="version">页面版本 <time id="page-version" datetime="2026-09-30T11:22:22+08:00">2026-09-30 11:22:22</time></div>

    <section class="panel" aria-labelledby="endpoint-title">
      <h1 id="endpoint-title">请求接口</h1>
      <div class="endpoint-row">
        <label for="endpoint">接口</label>
        <select id="endpoint">
          <option value="/api/poker/v1/entry">POST /api/poker/v1/entry</option>
          <option value="/api/poker/v1/rooms">POST /api/poker/v1/rooms</option>
        </select>
      </div>
      <code id="endpoint-url" class="endpoint-url"></code>
    </section>

    <section class="panel" aria-labelledby="request-title">
      <h2 id="request-title">请求内容</h2>
      <label class="field" for="access-token">Bearer access token
        <input id="access-token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴 access token">
      </label>
      <label class="field" for="request-body">JSON 请求体
        <textarea id="request-body" spellcheck="false" rows="7"></textarea>
      </label>
      <pre id="request-preview" class="json-view" aria-label="实际发送的请求"></pre>
      <div class="request-actions"><button id="send-request" type="button">发送请求</button><span id="request-error" role="alert"></span></div>
    </section>

    <section class="panel" aria-labelledby="response-title">
      <div class="response-heading"><h2 id="response-title">返回内容</h2><span id="response-status">尚未请求</span></div>
      <pre id="response-body" class="json-view" aria-live="polite">尚未发送请求</pre>
    </section>
  </main>
  <script type="module" src="./src/p.js"></script>
</body>
</html>
